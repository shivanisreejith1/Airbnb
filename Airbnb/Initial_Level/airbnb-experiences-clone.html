<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airbnb Experiences</title>
<style>

  /* =====================================================
     1. DESIGN TOKENS
     These are the same CSS variables used in airbnb2.html,
     so this page automatically matches its colors/spacing.
     If you ever change the pink in airbnb2.html, change it
     here too (there's no shared stylesheet between files yet).
     ===================================================== */
  :root{
    --pink: #FF385C;
    --pink-dark: #E31C5F;
    --text: #222222;
    --text-light: #717171;
    --border: #DDDDDD;
    --radius: 12px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  /* reset: every browser applies different default margins/padding,
     this makes every element start from zero so layout is predictable */
  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    background:#fff;
  }

  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  img{ max-width:100%; display:block; }

  /* .wrap centers content and caps its width on big screens,
     used inside header and main so both line up */
  .wrap{ max-width:1760px; margin:0 auto; padding:0 40px; }

  /* =====================================================
     2. HEADER
     ===================================================== */
  header{
    border-bottom:1px solid var(--border);
    padding:14px 0;
    position: sticky;   /* stays pinned to the top as you scroll */
    top:0;
    background:#fff;
    z-index: 100;       /* sits above the page content while scrolling */
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between; /* logo left, search middle, avatar right */
    gap:20px;
    flex-wrap: wrap;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    font-weight:800;
    color: var(--pink);
  }

  /* top nav: Homes / Experiences / Services, centered under the header row */
  .top-tabs{
    display:flex;
    justify-content:center;
    gap:48px;
  }
  .tab-btn{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:600;
    color: var(--text-light);
    padding:8px 4px;
    border-bottom:2px solid transparent; /* becomes visible when .active */
    position:relative; /* so the "NEW" badge can be positioned against it */
  }
  .tab-emoji{ font-size:20px; }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{
    color: var(--text);
    border-bottom-color: var(--text); /* the underline that marks the current page */
  }
  /* small pink "NEW" pill shown on the Services tab */
  .tab-new{
    position:absolute;
    top:-8px; right:-22px;
    background: var(--pink);
    color:#fff;
    font-size:9px;
    font-weight:700;
    padding:2px 6px;
    border-radius:999px;
  }

  /* Unlike the Homes page (which has a big 3-field search bar), the
     Experiences/Services pages show a compact "pill" summarizing the
     search: Anywhere · Anytime · Add guests */
  .search-pill{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:999px;
    box-shadow: var(--shadow);
    padding:10px 8px 10px 20px;
    font-size:14px;
    font-weight:500;
  }
  .search-pill span{ padding:0 14px; }
  .search-pill .sep{ width:1px; height:20px; background:var(--border); } /* vertical divider line */
  .search-pill input{
  border:none; outline:none; background:transparent;
  font: inherit; font-weight:500; color: var(--text);
  padding:0 14px; width:120px;
}
.search-pill input::placeholder{ color: var(--text); }

.empty-state{ text-align:center; padding:80px 20px; color: var(--text-light); }
  .search-pill .search-btn{
    background: var(--pink);
    color:#fff;
    width:32px; height:32px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin-left:8px;
  }

  .header-right{ display:flex; align-items:center; gap:14px; }
  .icon-btn{ padding:10px 14px; border-radius:999px; font-size:14px; font-weight:600; }
  .icon-btn:hover{ background:#f5f5f5; }
  .user-menu{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:999px;
    padding:6px 6px 6px 14px; box-shadow: var(--shadow);
  }
  .avatar{
    width:30px; height:30px; border-radius:50%;
    background:#717171; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }

  /* =====================================================
     3. MAIN CONTENT
     ===================================================== */
  main{ padding:28px 0 80px; }

  /* the small "Continue searching..." row near the top of the page */
  .continue-banner{
    display:flex;
    align-items:center;
    gap:16px;
    padding-bottom:28px;
    font-size:16px;
    font-weight:600;
  }
  .continue-banner img{
    width:56px; height:56px; border-radius:50%; object-fit:cover;
  }
  .continue-banner .arrow{ margin-left:6px; color:var(--text-light); }

  /* SECTION HEAD = the row above each rail: title on the left,
     round prev/next scroll buttons on the right */
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .section-title-group{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:600;
  }
  .section-title-group .link-arrow{
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .section-sub{ color:var(--text-light); font-size:15px; margin-top:2px; }
  .rail-nav{ display:flex; gap:8px; }
  .rail-nav button{
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    font-size:14px;
    background:#fff;
  }
  .rail-nav button:hover{ background:#f5f5f5; }

  section.rail-section{ margin-bottom:44px; }

  /* THE RAIL: a flex row that scrolls sideways instead of wrapping.
     overflow-x:auto is what makes it scrollable; the scrollbar-hiding
     rules just make it look cleaner (no visible scrollbar track) while
     still letting you scroll with touch/trackpad/the arrow buttons. */
  .rail{
    display:flex;
    gap:24px;
    overflow-x:auto;
    scroll-behavior:smooth;   /* animates when JS calls scrollBy() */
    scrollbar-width:none;     /* Firefox: hide scrollbar */
    padding-bottom:4px;
  }
  .rail::-webkit-scrollbar{ display:none; } /* Chrome/Safari: hide scrollbar */

  /* CARD: one experience. flex:0 0 220px means "don't grow, don't
     shrink, always be exactly 220px wide" — that fixed width is what
     lets the rail scroll horizontally instead of the cards wrapping
     onto a new line like a normal grid would. */
  .card{
    flex:0 0 220px;
    cursor:pointer;
  }
  .card-media{
    position:relative; /* lets the badge/heart-button sit on top of the image */
    border-radius: var(--radius);
    overflow:hidden;
    aspect-ratio: 3/4; /* tall photo, matches Airbnb's Experiences cards */
    background:#eee;   /* shows while the photo is still loading */
  }
  .card-media img{ width:100%; height:100%; object-fit:cover; }

  /* small label in the top-left of a card, e.g. "Original" or "Trending" */
  .badge{
    position:absolute;
    top:10px; left:10px;
    background:#fff;
    font-size:11px;
    font-weight:600;
    padding:5px 9px;
    border-radius:6px;
  }
  .badge.original{ display:flex; align-items:center; gap:5px; } /* room for the pencil emoji */

  .heart-btn{
    position:absolute; top:10px; right:10px;
    width:24px; height:24px;
  }
  .heart-btn svg{ width:100%; height:100%; }
  .heart-btn .fill{ fill: transparent; transition: fill .15s; }       /* filled pink once liked */
  .heart-btn.liked .fill{ fill: var(--pink); }
  .heart-btn .stroke{ stroke:#fff; stroke-width:2px; fill:rgba(0,0,0,0.35); } /* dark outline over any photo */
  .heart-btn.liked .stroke{ stroke: var(--pink); }

  .card-info{ padding-top:10px; }
  .card-row{ display:flex; justify-content:space-between; gap:8px; font-size:14.5px; }
  .card-title{ font-weight:600; line-height:1.3; }
  .card-rating{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .card-sub{ color: var(--text-light); font-size:14.5px; margin-top:2px; }
  .card-price{ margin-top:4px; font-size:14.5px; }
  .card-price b{ font-weight:600; }

  footer{
    border-top:1px solid var(--border);
    padding:24px 0;
    text-align:center;
    color: var(--text-light);
    font-size:13px;
  }

  /* small-screen tweaks: less horizontal padding, tighter tab spacing */
  @media (max-width:700px){
    .wrap{ padding:0 16px; }
    .top-tabs{ gap:24px; }
    .search-pill span{ padding:0 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <!-- logo links back to the Homes page (airbnb2.html) -->
    <a href="airbnb2.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="currentColor"><path d="M16 2c1.7 0 3 1.6 4.4 4.7l6.6 14.4c.9 2 1.3 3.5 1.3 4.7 0 3.3-2.4 5.7-5.6 5.7-2.1 0-3.7-1-5.4-3.2-.5-.6-.9-.6-1.4 0-1.7 2.2-3.3 3.2-5.4 3.2-3.2 0-5.6-2.4-5.6-5.7 0-1.1.4-2.6 1.3-4.7L13.6 6.7C15 3.6 14.3 2 16 2z"/></svg>
      airbnb
    </a>

    <!-- compact search summary pill (this page has no editable search
         fields yet — it's just a visual placeholder matching the real site) -->
    <div class="search-pill">
      <input id="search-where" type="text" placeholder="Anywhere">
      <div class="sep"></div>
      <span>Anytime</span>
      <div class="sep"></div>
      <span style="color:var(--text-light)">Add guests</span>
      <button class="search-btn" id="search-btn" aria-label="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>

    <div class="header-right">
      <a href="#" class="icon-btn">Switch to hosting</a>
      <div class="user-menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <div class="avatar">I</div>
      </div>
    </div>
  </div>

  <!-- top-tabs is left empty here on purpose — JS fills it in from the
       TABS array below, the same pattern airbnb2.html uses -->
  <div class="wrap">
    <nav class="top-tabs" id="top-tabs"></nav>
  </div>
</header>

<main class="wrap">

  <!-- static banner row, not driven by JS/data since there's only ever one -->
  <a href="#" class="continue-banner">
    <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?w=200" alt="">
    <span>Continue searching for experiences in Thiruvananthapuram</span>
    <span class="arrow">→</span>
  </a>

  <!-- these two containers start empty; renderRails() (in the script
       below) fills them in with rails built from ORIGINALS / CITY_RAILS -->
  <section class="rail-section" id="originals"></section>

  <div class="section-head" style="margin-bottom:0;">
    <h2 style="font-size:26px;">Popular with travellers from your area</h2>
  </div>
  <div style="height:20px"></div>

  <section class="rail-section" id="rail-container"></section>

</main>

<footer>
  Experiences page clone — built for practice, not affiliated with Airbnb.
</footer>

<script>
/* =====================================================
   DATA
   Everything on this page is built from these two data
   structures. Each "rail" is just: a title + a list of cards.
   Add/remove/edit cards here and the page updates automatically —
   you never need to touch the HTML-building functions below.
   ===================================================== */

// The very first rail on the page ("Airbnb Originals").
// It's a single object (not an array) because there's only ever one
// Originals rail, whereas CITY_RAILS below can have many.
const ORIGINALS = {
  title: "Airbnb Originals",
  subtitle: "Hosted by the world's most interesting people",
  badge: "Original",   // shown as a small label on every card in this rail
  items: [
    { title:"Carve marble with a third-generation sculptor", location:"Athens, Greece", price:6534, rating:5.0,
      photo:"https://images.unsplash.com/photo-1608889825205-eebdb9fc5806?w=400" },
    { title:"Art Walking Tour in San Miguel de Allende", location:"San Miguel de Allende, Mexico", price:3677, rating:null,
      photo:"https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=400" },
    
    { title:"Prosecco Hills: discover a small producer", location:"Conegliano, Italy", price:3050, rating:5.0,
      photo:"https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?w=400" },
    { title:"Participate in almsgiving and yoga in Chiang Mai", location:"Haiya Sub-district, Thailand", price:855, rating:4.95,
      photo:"https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=400" },
    { title:"Insider's Food Tour: South Philly & Italian Market", location:"Philadelphia, United States", price:9866, rating:5.0,
      photo:"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=400" },
    { title:"Blend incense with a priest at Seisho-ji Temple", location:"Kawachinagano, Japan", price:10528, rating:null,
      photo:"https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?w=400" }
  ]
};

// The "Popular with travellers from your area" rails, one per city.
// This IS an array — to add a new city rail, just add another object
// here with its own title/badge/items; renderRails() loops over all of them.
const CITY_RAILS = [
  {
    key:"bengaluru",              // used to build a unique element id for this rail
    title:"Experiences in Bengaluru",
    badge:"Trending",
    items:[
      
      { title:"Play with clay: Fun weekend pottery workshop", location:"", price:2000, rating:null,
        photo:"https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=400" },
      { title:"Street Food Tour near a Local Market in Bangalore", location:"", price:3333, rating:4.98,
        photo:"https://images.unsplash.com/photo-1596797038530-2c107229654b?w=400" },
      
      { title:"Walk in Lalbagh Botanical Garden", location:"", price:1400, rating:5.0,
        photo:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=400" },
      { title:"All You Knead is Love: Master Indian Breads", location:"", price:3500, rating:4.98,
        photo:"https://images.unsplash.com/photo-1584269600464-37b1b58a9fe7?w=400" }
    ]
  },
  {
    key:"south-goa",
    title:"Experiences in South Goa",
    badge:"Trending",
    items:[
      { title:"Trek to a hidden Cliff jumping Spot", location:"", price:2650, rating:4.94,
        photo:"https://images.unsplash.com/photo-1502680390469-be75c86b636f?w=400" },
      { title:"Explore Goa's Vibrant Latin Quarter Lanes", location:"", price:1533, rating:4.94,
        photo:"https://images.unsplash.com/photo-1587922546307-776227941871?w=400" },
      { title:"Stroll Goan history through Latin Quarter", location:"", price:1250, rating:5.0,
        photo:"https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=400" },
      { title:"Kayaking experience on the Chapora river.", location:"", price:2850, rating:4.98,
        photo:"https://images.unsplash.com/photo-1502933691298-84fc14542831?w=400" },
      { title:"Get hooked on Fishing Anjuna", location:"", price:1250, rating:4.98,
        photo:"https://images.unsplash.com/photo-1544943910-4c1dc44aab44?w=400" },
      { title:"Ferry to Divar Island hidden gems", location:"", price:1250, rating:4.9,
        photo:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=400" }
    ]
  }
];

/* =====================================================
   NAVIGATION (top-tabs)
   Unlike airbnb2.html — where Homes/Services stay on the same
   page and just toggle a <section> — every tab here is a plain
   link (<a href>) to a real page file. This page doesn't need
   its own "active section" JS logic at all, because the whole
   page IS the Experiences section.
   ===================================================== */
const state = { searchTerm: "" };

function matchesSearch(item){
  if (state.searchTerm === "") return true;
  const term = state.searchTerm.toLowerCase();
  return item.title.toLowerCase().includes(term) ||
    (item.location && item.location.toLowerCase().includes(term));
}
const TABS = [
  { key:"homes", label:"Homes", href:"airbnb2.html" },
  { key:"experiences", label:"Experiences", href:"airbnb-experiences-clone.html" },
  { key:"services", label:"Services",  href:"airbnb-services-clone.html", isNew:true }
];

// Builds the three tab links and marks "Experiences" as the active one
// (hard-coded here since this file only ever represents that one tab).
function renderTabs(){
  const nav = document.getElementById("top-tabs");
  nav.innerHTML = TABS.map(tab => `
    <a class="tab-btn ${tab.key === "experiences" ? "active" : ""}" href="${tab.href}">
      ${tab.isNew ? `<span class="tab-new">NEW</span>` : ""}
      <span>${tab.label}</span>
    </a>
  `).join("");
}

/* =====================================================
   CARD + RAIL BUILDERS
   These two functions are the reusable core of the page:
   cardHTML() turns ONE item into a card's HTML string,
   railHTML() wraps a whole group of items into a titled,
   horizontally-scrollable rail. Every rail on the page —
   Originals, Bengaluru, South Goa — is built by calling
   these same two functions with different data.
   ===================================================== */

// Builds a single card. badgeLabel is optional — pass "Original",
// "Trending", or leave it undefined/falsy to show no badge at all.
function cardHTML(item, badgeLabel){
  // some items (e.g. "Blend incense...") have no rating yet, so we
  // only render the star + number when a rating actually exists
  const ratingHTML = item.rating
    ? `<span class="card-rating">★ ${item.rating.toFixed(2)}</span>`
    : "";

  return `
    <div class="card">
      <div class="card-media">
        ${badgeLabel ? `<span class="badge ${badgeLabel === "Original" ? "original" : ""}">${badgeLabel === "Original" ? "🖊️ " : ""}${badgeLabel}</span>` : ""}

        <!-- heart/save button — toggled by the click listener in
             renderRails() below, purely visual (nothing is saved) -->
        <button class="heart-btn" data-action="heart" aria-label="Save">
          <svg viewBox="0 0 32 32">
            <path class="fill stroke" d="M16 28c-6-4.5-13-9.9-13-17A7.5 7.5 0 0 1 16 7a7.5 7.5 0 0 1 13 4c0 7.1-7 12.5-13 17z"/>
          </svg>
        </button>

        <img src="${item.photo}" alt="${item.title}">
      </div>
      <div class="card-info">
        <div class="card-row">
          <span class="card-title">${item.title}</span>
          ${ratingHTML}
        </div>
        <!-- some items have no location string (the city rails don't
             repeat the city name on every card), so this line is
             skipped entirely when item.location is empty -->
        ${item.location ? `<div class="card-sub">${item.location}</div>` : ""}
        <div class="card-price">From <b>₹${item.price.toLocaleString("en-IN")}</b> / guest</div>
      </div>
    </div>
  `;
}

// Builds one full rail: the title row (with prev/next buttons) plus
// the horizontally-scrolling strip of cards underneath.
// `id` becomes the DOM id of the .rail element, so the scroll
// buttons know which rail to scroll (see the data-target attribute).
function railHTML(id, group){
  return `
    <div class="section-head">
      <div>
        <div class="section-title-group">
          <span>${group.title}</span>
          <span class="link-arrow">→</span>
        </div>
        ${group.subtitle ? `<div class="section-sub">${group.subtitle}</div>` : ""}
      </div>
      <div class="rail-nav">
        <button data-scroll="prev" data-target="${id}">‹</button>
        <button data-scroll="next" data-target="${id}">›</button>
      </div>
    </div>
    <div class="rail" id="${id}">
      ${group.items.map(item => cardHTML(item, group.badge)).join("")}
    </div>
  `;
}

/* =====================================================
   RENDER + EVENTS
   ===================================================== */

// Draws every rail on the page, then attaches the two interactions
// every rail needs: the prev/next scroll buttons, and heart-toggling.
function renderRails(){
  const filteredOriginals = { ...ORIGINALS, items: ORIGINALS.items.filter(matchesSearch) };
  const filteredCityRails = CITY_RAILS
    .map(group => ({ ...group, items: group.items.filter(matchesSearch) }))
    .filter(group => group.items.length > 0);

  const originalsContainer = document.getElementById("originals");
  const railContainer = document.getElementById("rail-container");
  const nothingMatched = filteredOriginals.items.length === 0 && filteredCityRails.length === 0;

  if (nothingMatched){
    originalsContainer.innerHTML = "";
    railContainer.innerHTML = `<div class="empty-state">No experiences match "${state.searchTerm}". Try a different search.</div>`;
    return;
  }

  originalsContainer.innerHTML = filteredOriginals.items.length
    ? railHTML("rail-originals", filteredOriginals)
    : "";

  railContainer.innerHTML = filteredCityRails
    .map(group => `<div style="margin-bottom:44px">${railHTML("rail-" + group.key, group)}</div>`)
    .join("");

  document.querySelectorAll("[data-scroll]").forEach(btn => {
    btn.addEventListener("click", () => {
      const rail = document.getElementById(btn.dataset.target);
      const dir = btn.dataset.scroll === "next" ? 1 : -1;
      rail.scrollBy({ left: dir * 600, behavior: "smooth" });
    });
  });

  document.querySelectorAll(".rail").forEach(rail => {
    rail.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action='heart']");
      if (!btn) return;
      btn.classList.toggle("liked");
    });
  });
}

// Kick everything off once the script loads.
const searchInput = document.getElementById("search-where");
searchInput.addEventListener("input", (e) => {
  state.searchTerm = e.target.value.trim();
  renderRails();
});
document.getElementById("search-btn").addEventListener("click", () => {
  state.searchTerm = searchInput.value.trim();
  renderRails();
});
renderTabs();
renderRails();
</script>

</body>
</html>
